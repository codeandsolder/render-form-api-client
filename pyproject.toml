[tool.poetry]
name = "render-form-api-client"
version = "a85a34a_2025-02-11_20-58-47"
description = "A client library for accessing RenderForm API"
authors = []
readme = "README.md"
packages = [
    {include = "render_form_api_client"},
]
include = ["CHANGELOG.md", "render_form_api_client/py.typed"]


[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.20.0,<0.29.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
